[project]
name = "hr-policy-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "en-core-web-sm",
    "fastapi[standard]>=0.115.0",
    "flagembedding>=1.4.2",
    "ftfy>=6.3.1",
    "httpx>=0.27.0",
    "jupyter>=1.1.1",
    "lab>=8.10",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "ollama>=0.6.2",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rapidfuzz>=3.14.6",
    "rapidocr>=3.9.2",
    "rapidocr-onnxruntime>=1.4.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.54",
    "streamlit>=1.39.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/hr_agent", "ui"]
