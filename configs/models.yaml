# configs/models.yaml
#
# Three concerns live here:
#   1. roles:      provider+model per agent role, with optional `fallback_role`
#   2. providers:  per-provider connection defaults
#   3. models:     pricing used by llm/pricing.py for cost estimation
#
# Current posture: Groq is primary for every role. Ollama is the fallback
# target for every role, used only when Groq is unreachable or rate-limited.
# To flip a role back to local-first, swap the `provider:`/`model:` values
# on that role and its `*_local` sibling.
#
# Any `fallback_role` must be defined in this same map.

roles:
  # ---------------- generator ----------------
  generator:
    provider: groq
    model: openai/gpt-oss-20b
    temperature: 0.0
    timeout_s: 30
    max_retries: 1
    fallback_role: generator_local

  generator_local:
    provider: ollama
    model: qwen2.5:1.5b-instruct
    temperature: 0.0
    timeout_s: 60
    max_retries: 1

  # ---------------- router ----------------
  router:
    provider: groq
    model: openai/gpt-oss-20b
    temperature: 0.0
    timeout_s: 20
    max_retries: 1
    fallback_role: router_local

  router_local:
