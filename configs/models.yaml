# Provider connection defaults
providers:
  groq:
    base_url: "https://api.groq.com/openai/v1"
  ollama:
    base_url: "http://localhost:11434"

# Pricing (used by llm/pricing.py for cost estimates)
models:
  groq_llm:
    provider: groq
    input_cost_per_1k_usd: 0.05
    output_cost_per_1k_usd: 0.08

  ollama_llm:
    provider: ollama
    input_cost_per_1k_usd: 0.0
    output_cost_per_1k_usd: 0.0

tools:
  tavily_search:
    cost_per_call_usd: 0.005