services:
  postgres:
    image: postgres:16
    container_name: hr-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hr_agent
      POSTGRES_PASSWORD: hr_agent_dev
      POSTGRES_DB: hr_agent
      # Reasonable defaults for dev; tune for prod.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr_agent -d hr_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: